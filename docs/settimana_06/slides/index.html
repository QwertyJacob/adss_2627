    <section class="slide-img"><img src="img/05-fc38fc42e9.webp" width="1280" height="720" alt="Serie storiche come particolari campioni · Torniamo a considerare un generico campione A =〈ai〉i=1,...,n · Già sappiamo che A è interpretabile come una funzione, ai = a(i), A : I→X in cui il dominio I è l’insieme degli indici del campione il codominio X è l’insieme dei valori possibili per gli elementi del campione · Se i ∈ I è l’istante di tempo t in cui l’elemento ai è stato acquisito, il campione si chiama serie storica (in inglese: time series) (se i dati si riferiscono a una grandezza fisica, la serie è abitualmente chiamata segnale)"></section>
    <section class="slide-img"><img src="img/06-3677eba96d.webp" width="1280" height="720" alt="Serie storiche e campionamento · Di una serie storica A =〈at〉=〈a(t)〉=〈a(t0), a(t1), ...〉assumiamo per semplicità che gli istanti di tempo t di campionamento siano equidistanziati, e dunque che per ogni i, il periodo di campionamento ti+1 – ti sia costante, Δt (in pratica, che si acquisisca un elemento ogni Δt) Questo ci consente di scrivere nuovamente a(i), e perciò anche ai, al posto di a(ti) · Il numero di elementi acquisiti per unità di tempo è la frequenza di campionamento · Le serie storiche A : T→X si rappresentano mediante grafici x-y, mettendo in ascissa il tempo"></section>
    <section class="slide-img"><img src="img/07-0063dd675f.webp" width="1280" height="720" alt="Stessi numeri, storie diverse · Due campioni: ⟨10, 20, 30, 40, 50⟩ e ⟨50, 40, 30, 20, 10⟩ Hanno la stessa media (30), la stessa mediana (30), la stessa deviazione standard (15,8)… …ma come serie storiche raccontano due storie opposte: una crescita e un calo. Media, mediana, deviazione standard, percentili non dipendono dall&#x27;ordine dei valori. Per le serie storiche servono statistiche che tengano conto del tempo: le statistiche progressive e le statistiche mobili (dopo la pausa)."></section>
    <section class="slide-img"><img src="img/08-3a8627688f.webp" width="1280" height="720" alt="Simulare serie storiche · Una serie storica può essere costruita con dati “sintetici”, in modo deterministico (p.es. a(t) = k1 sin(k2 t) + k3 ) casuale (p.es. a(t) = k1 casuale() + k2 ) parzialmente casuale (p.es. a(t) = k1 sin(k2 t) + k3 casuale() + k4 ) · Una tecnica semplice ma interessante per costruire serie storiche in modo parzialmente casuale: cammino casuale (in inglese: random walk)"></section>
    <section class="slide-img"><img src="img/09-0dc6a4fa3b.webp" width="1280" height="720" alt="Cammini casuali (random walks) · Non è altro che la versione unidimensionale del moto browniano (it.wikipedia.org/wiki/Moto_browniano) · Una definizione con una struttura di questo genere si chiama ricorsiva: · base della ricorsione · a(0) = k1 a(i) = a(i – 1) + k2 casuale() + k3 · passo della ricorsione"></section>

    <section class="slide-img"><img src="img/11-d1885a623f.webp" width="1280" height="720" alt="In laboratorio: il cammino casuale · LABORATORIO · 1. Foglio nuovo. In A1 scrivi t, in B1 scrivi x 2. Parametri: H2 «x iniziale», H3 «passo minimo», H4 «ampiezza del passo»; in I2, I3, I4 i valori 0, −1, 2 3. A2: 0 A3: =A2+1 e ricopia fino ad A101 4. B2: =$I$2 B3: =B2+$I$3+$I$4*CASUALE() e ricopia fino a B101 5. Seleziona A1:B101 › Inserisci › Dispersione con linee rette 6. Premi F9 più volte. Poi metti −0,9 in I3: che cosa cambia? E con −1,1? Domanda: il passo è un numero a caso tra I3 e I3+I4. Quanto vale in media?"></section>
    <section class="slide-img"><img src="img/12-d1049c08dc.webp" width="1280" height="720" alt="Mettiti alla prova! Il magazzino · CHALLENGE · Un negozio parte con 30 pezzi in magazzino. Ogni giorno arrivano dal fornitore tra 0 e 10 pezzi e i clienti ne comprano tra 0 e 10 (numeri interi a caso). 1. Simula la scorta per 60 giorni e fanne il grafico 2. Qual è la scorta minima? E la massima? 3. In quanti giorni la scorta è sotto i 10 pezzi? 4. Premi F9 dieci volte: quante volte la scorta va sotto zero? Che cosa vuol dire per il negozio? 5. Se i clienti comprano tra 0 e 11 pezzi al giorno, che cosa cambia? Perché? Ti servono: CASUALE.TRA(0;10), MIN, MAX, CONTA.SE"></section>
    <section class="slide-img"><img src="img/13-2850603ade.webp" width="1280" height="720" alt="Prima della pausa · RIEPILOGO · • Una serie storica è un campione in cui l&#x27;ordine dei valori è il tempo • Un cammino casuale: ogni valore è il precedente più un passo casuale (base della ricorsione: il valore iniziale; passo: come si va avanti) • Il passo medio decide la tendenza: positivo sale, negativo scende Una domanda per te: perché, premendo F9, il cammino casuale sembra avere dei «trend» anche quando il passo medio è zero? Pausa: si riprende alle 10:30"></section>
    <section class="slide-img"><img src="img/14-4d23d66e90.webp" width="1280" height="720" alt="Statistiche per serie storiche: statistiche progressive · Di questa serie (1 feb - 14 nov 2020) si può calcolare la media campionaria, che però non è particolarmente significativa · Possiamo calcolare una statistica (la media, per esempio) mentre la serie si forma: si chiama media progressiva"></section>
    <section class="slide-img"><img src="img/15-10213a93c8.webp" width="1280" height="720" alt="Esempio: media progressiva · Di una serie storica A =〈ai〉 la media campionaria è un numero · mentre la media progressiva della sotto-serie Aj (la serie A fino al giorno di indice j) è a sua volta una serie storica · (notate che la formula è la stessa: la si usa solo in modo diverso) · Proprietà della media progressiva: converge alla media campionaria ( ) perde di sensibilità all’aumentare del numero di elementi della serie"></section>

    <section class="slide-img"><img src="img/21-3e8de548e5.webp" width="1280" height="720" alt="Media mobile (e media mobile pesata) come modelli statistici · Di una certa serie Y e di un certo giorno j ci sono diverse medie mobili · in funzione del numero k di elementi (l’“ampiezza della finestra”) su cui si calcola la media · Scegliendo un certo k diamo perciò un’interpretazione della serie Y · Chiamiamo modello statistico un’interpretazione di questo genere"></section>
