    <section class="slide-img"><img src="img/11-03b8cd1e20.webp" width="1280" height="720" alt="Il criterio di Gauss e il machine learning · Con l’obiettivo di trovare i valori di α e β che minimizzano la funzione di errore · possiamo anche: 1. scegliere dei valori iniziali per α e β in modo casuale 2. calcolare il gradiente di f, cioè le due derivate parziali e , che indicano la direzione in cui f cresce più rapidamente, così che e indicano la direzione in cui far diminuire f 3. assegnare e dove la costante k, chiamata “learning rate”, controlla la velocità di convergenza 4. ripetere dal passo 2 fino a che i valori di α e β non rimangono costanti · Questo algoritmo si chiama discesa…"></section>
    <section class="slide-img"><img src="img/12-dd84a98869.webp" width="1280" height="720" alt="In laboratorio: la retta migliore · LABORATORIO · Foglio nuovo. A1 settimana, B1 vendite (migliaia di €) A2:A11 le settimane 1…10; B2:B11: 3 5 4 6 8 7 9 11 10 12 Grafico a dispersione di A1:B11. Che retta disegneresti a occhio? Retta di prova: I2 (pendenza) = 1, I3 (intercetta) = 2 C2: =$I$2*A2+$I$3 D2: =B2-C2 (residuo) E2: =D2^2 fino alla riga 11 I4: =SOMMA(E2:E11) la somma dei quadrati dei residui Gara: cambia I2 e I3. Chi ottiene la somma più piccola? Poi: =PENDENZA(B2:B11;A2:A11) =INTERCETTA(B2:B11;A2:A11)"></section>
