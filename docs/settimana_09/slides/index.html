    <section class="slide-img"><img src="img/06-f3d0c502ae.webp" width="1280" height="720" alt="Un esempio di analisi di serie storiche: il controllo statistico di processo (SPC) · Contesto: produzione ripetitiva controllo di qualità in termini di conformità a specifiche → Gli oggetti prodotti sono caratterizzati da una grandezza X di cui sono specificati il valore nominale xspec e la tolleranza Δxspec → Si misura X sugli oggetti prodotti, ottenendo una serie storica 〈xi〉 → Si ammette che il processo di produzione sia non perfettamente stabile, e dunque che xi ≠ xspec → Si vuole però evitare di produrre oggetti non conformi alle specifiche"></section>
    <section class="slide-img"><img src="img/07-224fdf5bd3.webp" width="1280" height="720" alt="Il problema facile: accertare che le variazioni siano entro la tolleranza · Supponiamo che xspec= 2.0 e Δxspec= 0.5 (lasciando sottintesa l’unità di misura) (dunque l’oggetto i-esimo è accettabile se xi ∈ [xspec– Δxspec; xspec+ Δxspec]) · Per facilitare il monitoraggio, possiamo costruire una control chart (“carta di controllo”):"></section>
    <section class="slide-img"><img src="img/08-f6a1b26f90.webp" width="1280" height="720" alt="Il problema meno facile: distinguere variazioni casuali e non casuali · Quando le cause della variabilità sono solo casuali (“cause naturali”; inglese: common causes), si può ipotizzare che nella gran parte dei casi i valori della grandezza X siano nei limiti di conformità: il processo è “sotto controllo” Quando invece la variabilità ha cause non casuali (“cause sistematiche”; inglese: special causes) il processo è “fuori controllo” e occorre intervenire"></section>

    <section class="slide-img"><img src="img/12-0df679c109.webp" width="1280" height="720" alt="In laboratorio: bottiglie da 500 ml · LABORATORIO · A1 bottiglia, B1 volume (ml), C1 limite inferiore, D1 limite superiore I2 valore nominale 500; I3 tolleranza ± 15; I4 variabilità della macchina 8 A2 1, A3 =A2+1 fino ad A101 B2 =$I$2+$I$4*(CASUALE()+CASUALE()+CASUALE()-1,5) fino a B101 C2 =$I$2-$I$3 D2 =$I$2+$I$3 fino alla riga 101 Grafico di A1:D101 (dispersione con linee rette) I6 =CONTA.SE(B2:B101;&quot;&lt;&quot;&amp;C2)+CONTA.SE(B2:B101;&quot;&gt;&quot;&amp;D2) bottiglie non conformi Prova I4 = 12, poi 16: che cosa succede?"></section>
    <section class="slide-img"><img src="img/13-92874dfada.webp" width="1280" height="720" alt="Mettiti alla prova! Tre linee di riempimento · CHALLENGE · Tre linee riempiono bottiglie da 500 ml (tolleranza ±15). Simula 100 bottiglie per linea: linea 1: =500+6*(CASUALE()+CASUALE()+CASUALE()-1,5) linea 2: come la linea 1, +0,08*A2 linea 3: come la linea 1, +SE(RESTO(A2;10)=0;8;0) 1. Un grafico per linea. Le bottiglie sono tutte conformi? 2. Per ogni linea: la pendenza della retta di regressione e l&#x27;autocorrelazione al ritardo 10 (per la linea 1: =CORRELAZIONE(B12:B101;B2:B91)) 3. Quale linea è «sotto controllo»? Che cosa sta succedendo alle altre due?"></section>
    <section class="slide-img"><img src="img/14-d564397613.webp" width="1280" height="720" alt="Prima della pausa · RIEPILOGO · • La tolleranza (500 ± 15 ml) dice se un pezzo è conforme • Cause casuali: il processo è sotto controllo. Cause sistematiche: è fuori controllo • Un processo sotto controllo dà una serie stazionaria: niente trend (pendenza ≈ 0), niente periodicità (autocorrelazioni ≈ 0) Domanda: la linea 2 produce ancora bottiglie conformi. Va tutto bene? Pausa: si riprende alle 10:30"></section>
    <section class="slide-img"><img src="img/15-085819b913.webp" width="1280" height="720" alt="Identificare variazioni non casuali: le tecniche empiriche dello SPC · Per identificare se una serie (abbastanza lunga) è “abbastanza” stazionaria: dividiamo la serie in due parti (p.es. 50%-50%) usiamo la prima parte (training set) per calcolare media mrif e deviazione standard srif di riferimento con mrif e srif costruiamo una carta di controllo rappresentiamo sulla carta di controllo la seconda parte della serie (test set) studiamo la rappresentazione..."></section>

    <section class="slide-img"><img src="img/17-d484eb3930.webp" width="1280" height="720" alt="Limiti di tolleranza e limiti di controllo · Limiti di tolleranza (500 ± 15 ml): li decide il cliente, o chi ha progettato il prodotto. Dicono se un pezzo è conforme. Limiti di controllo (m_rif ± 3 s_rif): vengono dal processo stesso, dalla sua storia (training). Dicono se il processo si comporta come al solito. Sono due domande diverse: • un processo stabile ma troppo disperso produce pezzi non conformi • un processo che sta cambiando può produrre ancora solo pezzi conformi… per poco"></section>
    <section class="slide-img"><img src="img/18-7c4b00a952.webp" width="1280" height="720" alt="Identificare variazioni non casuali: le tecniche empiriche dello SPC /3 · Un esempio – La serie è non stazionaria se: [regola 1] un elemento è oltre ±3srif [regola 2] 2 su 3 elementi consecutivi sono oltre ±2srif nello stesso lato rispetto a mrif [regola 3] 4 su 5 elementi consecutivi sono oltre ±srif nello stesso lato rispetto a mrif [regola 4] 9 elementi consecutivi sono nello stesso lato rispetto a mrif · Una statistica, chiamata capacità di processo (inglese: process capability), sintetizza l’informazione sulla qualità del processo in termini della sua ripetibilità: · oppure in termini…"></section>
    <section class="slide-img"><img src="img/19-6b337bab37.webp" width="1280" height="720" alt="La capacità di processo, in pratica · Cp = 2 Δx_spec / (6 s) = larghezza della tolleranza / larghezza «naturale» del processo (6 deviazioni standard: da −3 s a +3 s) • Cp &lt; 1: il processo è più largo della tolleranza: produce scarti anche quando è stabile e centrato • Cp ≥ 1: ci sta; nell&#x27;industria spesso si chiede almeno 1,33 • Esempio: tolleranza ±15 ml, s = 4 ml → Cp = 30 / 24 = 1,25 Nella prima formula, 6 s_rif / 6 s, al posto della tolleranza c&#x27;è la fascia di controllo del training, e s è la deviazione standard del test: Cp &lt; 1 vuol dire «più disperso di prima»."></section>
