    <section class="slide-img"><img src="img/07-23f63a9216.webp" width="1280" height="720" alt="Cos’è una variabile? · Una variabile X è un’entità matematica che ha un valore, x (per esempio, 1,75 m per la variabile altezza), e generalmente più di un valore è possibile, dunque x ∈ V = {x1, x2, …} (se un solo valore è effettivamente possibile, la variabile è una costante) Per chiarire la ragione della variabilità, si trattano le variabili come funzioni, da entità a valori, X: A → V, X(a) = x (per esempio, altezza(Alex) = 1,75 m) (le variabili sono perciò il correlato matematico delle proprietà empiriche, e infatti a volte non si distingue, e si dice “l’altezza delle persone è una varia…"></section>
    <section class="slide-img"><img src="img/08-5e49c24a14.webp" width="1280" height="720" alt="Variabili ed eventi · Per ogni valore x ∈ V, chiamiamo X(a) = x (o anche X = x) evento elementare (per esempio, altezza(Alex) = 1,75 m è un evento elementare) Gli eventi si possono comporre, secondo le regole della logica o dell’insiemistica, e ottenendo così eventi composti (per esempio altezza = 1,75 m oppure altezza = 1,76 m oppure altezza = 1,77 m ... è equivalente all’evento composto altezza ≥ 1,75 m) Gli operatori di composizione più semplici sono: ⋁ (“oppure”, disgiunzione) ⋀ (“e”, congiunzione) — (“non”, negazione)"></section>
    <section class="slide-img"><img src="img/09-ab7c81626f.webp" width="1280" height="720" alt="Cos’è una variabile casuale? · Una variabile è deterministica quando, data l’entità, il suo valore è fissato Si chiama invece variabile casuale (o aleatoria, o stocastica) una variabile il cui valore è specificato solo attraverso una distribuzione D definita sull’insieme D dei suoi valori, una situazione che si indica X ~ D (e si legge: “X è distribuita come D”, oppure “X segue la distribuzione D”) · Dunque possiamo interpretare il nostro esperimento di 100 lanci di un dado come l’assegnazione di valori a una variabile casuale X che ha la distribuzione D che abbiamo costruito, supponendo ch…"></section>
    <section class="slide-img"><img src="img/10-03dcc5df4e.webp" width="1280" height="720" alt="Un percorso /2 · Data dunque X ~ D, calcoliamo qualche frequenza relativa di eventi composti (per esempio f(X = 2 ⋁ X = 4 ⋁ X = 6) oppure f(— (X ≥ 4))) Possiamo considerare la media e la deviazione standard calcolate prima come statistiche della variabile casuale: m(X) e s2(X); consideriamo una funzione g(X) della variabile casuale X, per esempio X = x2, e calcoliamone la media, sul campione e sulla distribuzione Dunque ricordando che m(X) = ∑i xi f(X = xi), s2(X) = ∑i (xi – m(X))2 f(X = xi) allora m(g(X)) = ∑i g(xi) f(X = xi)) s2(g(X)) = ∑i (g(xi) – m(g(X)))2 f(X = xi)"></section>

    <section class="slide-img"><img src="img/15-86f7641066.webp" width="1280" height="720" alt="Il teorema del limite centrale (*) · La media (o la somma, dunque) di variabili casuali indipendenti (**) e aventi la stessa distribuzione (***) tende a una distribuzione “a campana” (chiamata “normale” o “gaussiana”), indipendentemente dalla loro distribuzione, all’aumentare del numero di variabili sommate · (*) O “teorema centrale del limite”? (**) Condizione che chiariremo: indicativamente, due variabili casuali sono indipendenti se conoscere i valori di una non porta informazione sui valori dell’altra (***) Condizione nota con la sigla i.i.d., dall’inglese “independent and identically d…"></section>
    <section class="slide-img"><img src="img/16-d08f76b46b.webp" width="1280" height="720" alt="Un percorso /4 · Di ognuna delle 20 variabili casuali, X1, …, X20, calcoliamo la media, m(Xj): in questo modo abbiamo ottenuto un campione di medie campionarie Cosa possiamo dire della media, m(〈m(Xj)〉), di questo campione? · (la media è un operatore lineare, e quindi m(〈m(Xj)〉) è approssimativamente uguale a ogni m(Xj) ed è uguale alla media del campione di 100 x 20 valori) · E cosa possiamo dire della deviazione standard, s(〈m(Xj)〉)? · (mentre ogni s(Xj) è approssimativamente uguale alla deviazione standard del campione di 100 x 20 valori, s(〈m(Xj)〉) è molto più piccola: perché?)"></section>

    <section class="slide-img"><img src="img/18-7db149e5fb.webp" width="1280" height="720" alt="Perché le medie oscillano meno · In un campione di 50 lanci i valori alti e quelli bassi si compensano: è raro che siano tutti alti, o tutti bassi. • Un dado: media 3,5, deviazione standard 1,71 • La media di 50 lanci: media 3,5, deviazione standard 1,71 / √50 ≈ 0,24 • Per dimezzare l&#x27;oscillazione di una media servono 4 volte più dati La forma: ci sono tantissimi modi di ottenere una media vicina a 3,5 e pochissimi di ottenerne una estrema → distribuzione a campana"></section>
